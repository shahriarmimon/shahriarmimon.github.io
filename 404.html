<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | Shahriar M. I. Talukder</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .not-found-wrap {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .not-found-code {
      font-size: 6rem;
      font-weight: 800;
      color: var(--accent-primary);
      line-height: 1;
      margin-bottom: 1rem;
    }

<body>
  <div class="not-found-wrap">
    <div class="not-found-code">404</div>
    <h1 style="margin-bottom: 1rem;">Page Not Found</h1>
    <p style="color: var(--text-muted); margin-bottom: 2rem; max-width: 460px;">
      The page or resource you are looking for has been moved, removed, or does not exist.
    </p>
    <a href="index.html" class="btn btn-primary">
      <span>Return to Homepage</span>
    </a>

</html>
