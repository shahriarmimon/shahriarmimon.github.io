<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" width="280" height="280">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="280" height="280" rx="40" fill="url(#bgGradient)" />

  <!-- Accent Ring -->
  <circle cx="140" cy="140" r="118" fill="none" stroke="url(#ringGrad)" stroke-width="3" stroke-dasharray="6 6" opacity="0.6" />
  <circle cx="140" cy="140" r="108" fill="#131e33" />

  <!-- Botanical / Molecular Graphical Elements -->
  <g opacity="0.15">
    <circle cx="95" cy="85" r="14" fill="#38bdf8" />
    <circle cx="185" cy="85" r="14" fill="#34d399" />
    <circle cx="140" cy="210" r="16" fill="#10b981" />
    <line x1="95" y1="85" x2="140" y2="210" stroke="#ffffff" stroke-width="1.5" />
    <line x1="185" y1="85" x2="140" y2="210" stroke="#ffffff" stroke-width="1.5" />
    <line x1="95" y1="85" x2="185" y2="85" stroke="#ffffff" stroke-width="1.5" />
  </g>

  <!-- Central Scientific Monogram -->
  <g transform="translate(140, 130)">
    <!-- Stylized Leaf Stem -->
    <path d="M0 -55 C 22 -35, 28 -5, 0 15 C -28 -5, -22 -35, 0 -55 Z" fill="url(#leafGrad)" />
    <path d="M0 -50 L 0 10" stroke="#ffffff" stroke-width="1.5" opacity="0.4" />
    <!-- Monogram Text -->
    <text x="0" y="52" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="3">S. M. I.</text>
    <text x="0" y="70" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#34d399" text-anchor="middle" letter-spacing="2">TALUKDER</text>
  </g>
</svg>
